<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyMood - Weather & Vibe Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F4EFFA;
      --card-bg: #FFFFFF;
      --text-main: #1A1A1A;
      --accent-coral: #FF6B6B;
      --accent-yellow: #FFD1FF;
      --accent-mint: #06D6A0;
      --accent-blue: #118AB2;
      --accent-purple: #C77DFF;
      --border-color: #1A1A1A;
      --shadow-offset: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
    }

    /* Neo-Brutalist Panel */
    .panel {
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 24px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
      padding: 2.2rem;
      position: relative;
    }

    .header-badge {
      font-family: 'Fredoka', cursive;
      display: inline-block;
      background: var(--accent-purple);
      color: #FFF;
      border: 2.5px solid var(--border-color);
      padding: 0.35rem 0.9rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-family: 'Fredoka', cursive;
      font-size: 2.3rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }

    /* Search Container & Autocomplete */
    .search-container {
      position: relative;
      margin-bottom: 1.8rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem 1.2rem;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      outline: none;
      background: #FAFAFA;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      background: #FFF;
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px var(--border-color);
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 14px;
      margin-top: 8px;
      box-shadow: 4px 4px 0px var(--border-color);
      max-height: 240px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .dropdown-item {
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid #F0F0F0;
      transition: background 0.15s;
    }

    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: var(--accent-yellow); }

    /* Weather Content Layout */
    .weather-display {
      display: none;
    }

    .weather-display.active {
      display: block;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-weather {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 3px dashed var(--border-color);
      margin-bottom: 1.5rem;
    }

    .location-tag {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .weather-icon {
      font-size: 5.2rem;
      margin: 0.2rem 0;
      line-height: 1.1;
      filter: drop-shadow(4px 4px 0px var(--border-color));
    }

    .temperature {
      font-family: 'Fredoka', cursive;
      font-size: 4.2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .condition-desc {
      display: inline-block;
      background: var(--accent-yellow);
      border: 2.5px solid var(--border-color);
      padding: 0.35rem 1.1rem;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    /* Weather Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .metric-card {
      background: #F8F9FA;
      border: 2.5px solid var(--border-color);
      border-radius: 16px;
      padding: 0.85rem 1rem;
    }

    .metric-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      opacity: 0.65;
      margin-bottom: 0.2rem;
    }

    .metric-value {
      font-family: 'Fredoka', cursive;
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Recommendations & Tips Box */
    .tips-box {
      background: #FFF;
      border: 3px solid var(--border-color);
      border-radius: 18px;
      padding: 1.2rem;
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .tips-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tip-item {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      background: #F4F4F4;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem;
      margin-bottom: 0.6rem;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .tip-item:last-child { margin-bottom: 0; }
    .tip-icon { font-size: 1.3rem; line-height: 1; }

    /* Helper States */
    .status-msg {
      text-align: center;
      font-weight: 700;
      padding: 2rem 1rem;
      color: #666;
    }

    .loader {
      display: none;
      text-align: center;
      font-family: 'Fredoka', cursive;
      font-size: 1.2rem;
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="panel">
      <div class="header-badge">Real-Time Forecast</div>
      <h1>SkyMood 🌤️</h1>

      <div class="search-container">
        <input type="text" id="cityInput" placeholder="Start typing a city name..." autocomplete="off">
        <div class="dropdown" id="dropdown"></div>
      </div>

      <div class="status-msg" id="placeholder">Search and select a city above to check live weather & tips!</div>
      <div class="loader" id="loader">Checking the skies... 🎈</div>

      <section class="weather-display" id="weatherDisplay">
        
        <!-- Hero Section -->
        <div class="hero-weather">
          <div class="location-tag" id="cityName">--</div>
          <div class="weather-icon" id="weatherIcon">☀️</div>
          <div class="temperature" id="tempValue">--°C</div>
          <div class="condition-desc" id="conditionText">--</div>
        </div>

        <!-- Detailed Metrics -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">Feels Like</div>
            <div class="metric-value" id="feelsLike">--°C</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Humidity</div>
            <div class="metric-value" id="humidity">--%</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Wind Speed</div>
            <div class="metric-value" id="wind">-- km/h</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">UV Index</div>
            <div class="metric-value" id="uvIndex">--</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Precipitation</div>
            <div class="metric-value" id="precip">-- mm</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Air Pressure</div>
            <div class="metric-value" id="pressure">-- hPa</div>
          </div>
        </div>

        <!-- Weather Tips & Recommendations -->
        <div class="tips-box">
          <div class="tips-title">💡 Weather Survival Tips</div>
          <div id="tipsContainer"></div>
        </div>

      </section>
    </main>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const dropdown = document.getElementById('dropdown');
    const weatherDisplay = document.getElementById('weatherDisplay');
    const placeholder = document.getElementById('placeholder');
    const loader = document.getElementById('loader');

    // Weather code interpreter
    const wmoMap = {
      0: { text: "Clear Sky", icon: "☀️" },
      1: { text: "Mainly Clear", icon: "🌤️" },
      2: { text: "Partly Cloudy", icon: "⛅" },
      3: { text: "Overcast", icon: "☁️" },
      45: { text: "Foggy", icon: "🌫️" },
      48: { text: "Rime Fog", icon: "🌫️" },
      51: { text: "Light Drizzle", icon: "🌦️" },
      53: { text: "Moderate Drizzle", icon: "🌧️" },
      55: { text: "Dense Drizzle", icon: "🌧️" },
      61: { text: "Slight Rain", icon: "🌧️" },
      63: { text: "Moderate Rain", icon: "🌧️" },
      65: { text: "Heavy Rain", icon: "🌧️" },
      71: { text: "Light Snow", icon: "🌨️" },
      73: { text: "Moderate Snow", icon: "❄️" },
      75: { text: "Heavy Snow", icon: "❄️" },
      80: { text: "Rain Showers", icon: "🌦️" },
      95: { text: "Thunderstorm", icon: "🌩️" }
    };

    // --- Autocomplete Search Logic ---
    let typingTimer;

    cityInput.addEventListener('input', (e) => {
      clearTimeout(typingTimer);
      const query = e.target.value.trim();
      
      if (query.length < 2) {
        dropdown.style.display = 'none';
        return;
      }
      
      typingTimer = setTimeout(() => fetchCities(query), 300);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        dropdown.style.display = 'none';
      }
    });

    async function fetchCities(query) {
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
        const data = await res.json();
        
        dropdown.innerHTML = '';
        
        if (data.results && data.results.length > 0) {
          data.results.forEach(city => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            const area = city.admin1 ? `, ${city.admin1}` : '';
            item.textContent = `${city.name}${area}, ${city.country}`;
            
            item.addEventListener('click', () => {
              cityInput.value = item.textContent;
              dropdown.style.display = 'none';
              fetchWeather(city.latitude, city.longitude, city.name, city.country);
            });
            
            dropdown.appendChild(item);
          });
          dropdown.style.display = 'block';
        } else {
          dropdown.style.display = 'none';
        }
      } catch (err) {
        console.error("Geocoding failed:", err);
      }
    }

    // --- Weather Data Fetching & Rendering ---
    async function fetchWeather(lat, lng, name, country) {
      placeholder.style.display = 'none';
      weatherDisplay.classList.remove('active');
      loader.style.display = 'block';

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,uv_index`;
        const res = await fetch(url);
        const data = await res.json();
        const current = data.current;

        // Populate Text Fields
        document.getElementById('cityName').textContent = `${name}, ${country}`;
        document.getElementById('tempValue').textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
        document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        document.getElementById('uvIndex').textContent = current.uv_index !== undefined ? current.uv_index.toFixed(1) : 'N/A';
        document.getElementById('precip').textContent = `${current.precipitation} mm`;
        document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

        const info = wmoMap[current.weather_code] || { text: "Variable", icon: "🌡️" };
        document.getElementById('conditionText').textContent = info.text;
        document.getElementById('weatherIcon').textContent = info.icon;

        // Generate Tips & Activities based on conditions
        generateRecommendations(current, current.weather_code);

        loader.style.display = 'none';
        weatherDisplay.classList.add('active');

      } catch (err) {
        console.error(err);
        loader.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = "Failed to load weather data. Please try again.";
      }
    }

    // --- Contextual Recommendations Generator ---
    function generateRecommendations(current, code) {
      const tipsContainer = document.getElementById('tipsContainer');
      tipsContainer.innerHTML = '';

      const tips = [];
      const temp = current.temperature_2m;
      const uv = current.uv_index || 0;
      const precip = current.precipitation || 0;
      const wind = current.wind_speed_10m || 0;

      // Rain / Snow / Precipitation Tips
      if ([51, 53, 55, 61, 63, 65, 80, 95].includes(code) || precip > 0.5) {
        tips.push({ icon: "☔", text: "Rain in the area! Grab an umbrella or a waterproof coat before stepping out." });
        tips.push({ icon: "☕", text: "Ideal vibe: Cozy café visit, reading indoors, or catching up on a movie." });
      } else if ([71, 73, 75, 77, 85].includes(code)) {
        tips.push({ icon: "🥾", text: "Snowy weather! Wear boots with solid grip and extra thermal layers." });
        tips.push({ icon: "🍲", text: "Perfect time for a steaming bowl of soup or hot chocolate." });
      }

      // Temperature Clothing Tips
      if (temp <= 10) {
        tips.push({ icon: "🧥", text: "Chilly out there! Dress in warm layers, a scarf, and a thick jacket." });
      } else if (temp > 10 && temp <= 22) {
        tips.push({ icon: "👟", text: "Mild & comfortable! A light sweater or hoodie over a tee is all you need." });
      } else if (temp > 22 && temp <= 30) {
        tips.push({ icon: "👕", text: "Warm weather! Go for breathable cotton or linen clothing." });
      } else if (temp > 30) {
        tips.push({ icon: "🍦", text: "It's hot! Stay hydrated, seek shade, and treat yourself to something iced." });
      }

      // UV & Outdoor Activity Tips
      if (uv >= 5) {
        tips.push({ icon: "🧴", text: "High UV index! Apply SPF 30+ sunscreen and wear sunglasses outdoors." });
      }

      if (wind > 25) {
        tips.push({ icon: "🧢", text: "Breezy conditions! Secure loose hats and hold onto umbrellas firmly." });
      }

      // General Activity Fallback
      if (tips.length < 2 && temp >= 15 && temp <= 27 && precip === 0) {
        tips.push({ icon: "🚲", text: "Great outdoor conditions! Perfect for a park walk, cycling, or patio coffee." });
      }

      // Render tips to DOM
      tips.slice(0, 3).forEach(tip => {
        const item = document.createElement('div');
        item.className = 'tip-item';
        item.innerHTML = `<span class="tip-icon">${tip.icon}</span><span>${tip.text}</span>`;
        tipsContainer.appendChild(item);
      });
    }
  </script>
</body>
</html>
